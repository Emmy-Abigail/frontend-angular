<section class="login">

  <div class="login-topbar"></div>

  <div class="login-card">

    <div class="login-brand">

      <span class="login-brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M3 6.5 12 11l9-4.5M12 11v11" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </span>

      <span class="login-brand-name">RIVA</span>

    </div>

    <div class="login-header">

      <h1>Acceso Administrativo</h1>

      <p>Gestión de Envíos v1.0</p>

    </div>

    <form
      class="login-form"
      (ngSubmit)="iniciarSesion()"
    >

      <div class="form-group">

        <label for="correo">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 20c1.5-3.5 4.8-5.5 8-5.5s6.5 2 8 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Nombre de Usuario
        </label>

        <input
          id="correo"
          name="correo"
          type="text"
          placeholder="Ej. admin_logistic"
          [(ngModel)]="correo"
          required
        />

      </div>

      <div class="form-group">

        <div class="login-field-row">

          <label for="contrasena">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            Contraseña
          </label>

          <a class="login-forgot" href="javascript:void(0)">
            ¿Olvidó su contraseña?
          </a>

        </div>

        <div class="login-password-field">

          <input
            id="contrasena"
            name="contrasena"
            [type]="mostrarContrasena ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="contrasena"
            required
          />

          <button
            type="button"
            class="login-toggle-password"
            (click)="alternarContrasena()"
            [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarContrasena) {
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3l18 18M10.6 10.6a2.8 2.8 0 0 0 3.95 3.95M9.5 5.2A10.6 10.6 0 0 1 12 5c5 0 8.6 3.4 10 7-0.5 1.3-1.3 2.6-2.3 3.7M6.6 6.6C4.4 8 2.9 9.9 2 12c1.4 3.6 5 7 10 7 1.2 0 2.4-0.2 3.5-0.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12c1.4-3.6 5-7 10-7s8.6 3.4 10 7c-1.4 3.6-5 7-10 7s-8.6-3.4-10-7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            }
          </button>

        </div>

      </div>

      @if (error) {
        <p class="login-error">
          {{ error }}
        </p>
      }

      <button type="submit" class="login-submit">
        Entrar al Sistema
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </form>

    <div class="login-footer">

      <div class="login-secure">
        <svg viewBox="0 0 24 24" width="13" h eight="13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3 5 6v5.5c0 4.4 3 8 7 9 4-1 7-4.6 7-9V6l-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="m9.5 12 1.8 1.8L14.8 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Conexión segura bajo protocolo SSL de 256 bits
      </div>

      <p class="login-copy">
        © 2026 LogisticAdmin Pro. Todos los derechos reservados.<br>
        Acceso restringido únicamente a personal autorizado.
      </p>

    </div>

  </div>

</section>
