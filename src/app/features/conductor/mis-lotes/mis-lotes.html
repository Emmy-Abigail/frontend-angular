
<div class="mis-lotes-view">

  <!-- Encabezado -->
  <header class="view-header">
    <h1>MIS LOTES</h1>
  </header>

  <div class="view-content">

    <!-- Filtros y contadores -->
    <div class="tabs-segment" aria-label="Filtrar lotes">

      <button
        type="button"
        class="tab-btn"
        [class.active]="filtroActivo === 'TODOS'"
        (click)="cambiarFiltro('TODOS')"
      >
        TODOS
      </button>

      <button
        type="button"
        class="tab-btn"
        [class.active]="filtroActivo === 'ASIGNADO'"
        (click)="cambiarFiltro('ASIGNADO')"
      >
        Asignado: {{ cantidadAsignados }}
      </button>

      <button
        type="button"
        class="tab-btn"
        [class.active]="filtroActivo === 'EN_RUTA'"
        (click)="cambiarFiltro('EN_RUTA')"
      >
        En ruta: {{ cantidadEnRuta }}
      </button>

    </div>

    <!-- Lista de lotes -->
    <section
      *ngIf="lotesVisibles.length > 0"
      class="lotes-list"
      aria-label="Mis lotes asignados"
    >

      <button
        type="button"
        class="lote-card"
        *ngFor="let lote of lotesVisibles"
        (click)="abrirLote(lote)"
      >

        <!-- Icono del lote -->
        <span class="lote-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="25"
            height="25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2.8 21 7.7 12 12.6 3 7.7 12 2.8Z" />
            <path d="M3 7.7v9l9 5 9-5v-9" />
            <path d="M12 12.6v9.1" />
            <path d="m7.5 5.3 9 5" />
          </svg>
        </span>

        <!-- Información principal -->
        <span class="lote-information">

          <span class="lote-card-header">
            <strong class="lote-code">{{ lote.codigo }}</strong>

            <span
              class="lote-status"
              [class.status-assigned]="lote.estado === 'ASIGNADO'"
              [class.status-route]="lote.estado === 'EN_RUTA'"
            >
              {{ lote.estado === 'ASIGNADO' ? 'ASIGNADO' : 'EN RUTA' }}
            </span>
          </span>

          <span
            class="lote-route"
            *ngIf="lote.zonaOrigen || lote.zonaDestino"
          >
            <svg
              viewBox="0 0 24 24"
              width="12"
              height="12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <circle cx="12" cy="5" r="2.5" />
              <circle cx="6" cy="17" r="2.5" />
              <circle cx="18" cy="17" r="2.5" />
              <path d="M10.5 7 7.5 14.5M13.5 7l3 7.5M8.5 17h7" />
            </svg>

            <span>
              {{ lote.zonaOrigen }}
              <ng-container *ngIf="lote.zonaOrigen && lote.zonaDestino">
                →
              </ng-container>
              {{ lote.zonaDestino }}
            </span>
          </span>

          <span
            class="lote-summary"
            *ngIf="lote.paquetes > 0 || lote.paradas > 0"
          >
            <ng-container *ngIf="lote.paquetes > 0">
              {{ lote.paquetes }} paquetes
            </ng-container>

            <ng-container *ngIf="lote.paquetes > 0 && lote.paradas > 0">
              ·
            </ng-container>

            <ng-container *ngIf="lote.paradas > 0">
              {{ lote.paradas }} paradas
            </ng-container>
          </span>

          <span class="lote-time">
            {{ lote.horaAsignacion }}
          </span>

        </span>

        <!-- Indicador de navegación -->
        <span class="lote-chevron" aria-hidden="true">›</span>

      </button>

    </section>

    <!-- Estado vacío -->
    <section
      *ngIf="lotesVisibles.length === 0"
      class="empty-state"
    >

      <div class="empty-title">
        <svg
          viewBox="0 0 24 24"
          width="25"
          height="25"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 2.8 21 7.7 12 12.6 3 7.7 12 2.8Z" />
          <path d="M3 7.7v9l9 5v-9.1" />
          <path d="m21 7.7-9 4.9" />
          <circle cx="17.5" cy="17.5" r="4" fill="#f5f6f8" />
          <path d="m20.5 20.5 2 2" />
        </svg>

        <h2>Sin lotes pendientes</h2>
      </div>

      <p>
        Actualmente no tienes lotes de entrega asignados a tu cuenta.
        Por favor, espera nuevas instrucciones o intenta actualizar la lista.
      </p>

      <button
        type="button"
        class="refresh-button"
        (click)="actualizarLista()"
      >
        <svg
          viewBox="0 0 24 24"
          width="19"
          height="19"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 7v5h-5" />
          <path d="M4 17v-5h5" />
          <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12" />
          <path d="M18.4 15a7 7 0 0 1-11.7 2L4 12" />
        </svg>

        Actualizar Lista
      </button>

    </section>

  </div>

</div>
