<div class="mis-lotes-view">

  <!-- Header de pantalla (Visily Pantalla 16) -->
  <header class="view-header">
    <h1>MIS LOTES ASIGNADOS</h1>
  </header>

  <div class="view-content">

    <!-- Buscador -->
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#64748b" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        [(ngModel)]="busqueda"
        placeholder="Buscar ID de lote..."
      />
    </div>

    <!-- Segment / Tabs -->
    <div class="tabs-segment">
      <button
        type="button"
        class="tab-btn"
        [class.active]="tabActiva === 'TODOS'"
        (click)="cambiarTab('TODOS')"
      >
        TODOS
      </button>

      <button
        type="button"
        class="tab-btn"
        [class.active]="tabActiva === 'EN_RUTA'"
        (click)="cambiarTab('EN_RUTA')"
      >
        EN RUTA
      </button>

      <button
        type="button"
        class="tab-btn"
        [class.active]="tabActiva === 'PENDIENTE'"
        (click)="cambiarTab('PENDIENTE')"
      >
        PENDIENTE
      </button>
    </div>

    <!-- Estado vacío según Visily 16 -->
    <div class="empty-state-card">
      <p class="empty-text">
        No tienes lotes asignados. Cuando un operador te asigne un lote, lo verás aquí
      </p>
    </div>

  </div>

</div>
