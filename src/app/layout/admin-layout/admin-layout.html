<div class="admin-shell">

  <!-- Sidebar estilo Visily RIVA -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
          <path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z"/>
          <path d="M3 6.5 12 11l9-4.5M12 11v11"/>
        </svg>
      </div>
      <div class="brand-info">
        <span class="brand-name">RIVA</span>
        <span class="brand-version">Pro v1.0</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">ADMINISTRACIÓN</div>

      <a
        routerLink="/admin/usuarios"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Lista de Personal</span>
      </a>

      <a
        routerLink="/admin/usuarios/nuevo"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span>Alta de Personal</span>
      </a>

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span>Dashboard</span>
      </a>
    </nav>

    <!-- Perfil del usuario abajo (Visily) -->
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">
          AD
        </div>
        <div class="user-details">
          <span class="user-name">{{ currentUser()?.nombres || 'Admin User' }}</span>
          <span class="user-role-label">Administrador</span>
        </div>
      </div>

      <button type="button" class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>

  </aside>

  <!-- Contenedor principal con Topbar y router-outlet -->
  <div class="main-wrapper">

    <!-- Topbar estilo Visily -->
    <header class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Buscar paquetes..." />
      </div>

      <div class="topbar-actions">
        <button type="button" class="topbar-icon-btn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <div class="topbar-user">
          <div class="topbar-avatar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="topbar-user-info">
            <span class="topbar-user-name">{{ currentUser()?.nombres || 'Admin User' }}</span>
            <span class="topbar-user-email">{{ currentUser()?.correo || 'admin@email.com' }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Espacio dinámico de rutas -->
    <main class="content-body">
      <router-outlet />
    </main>

  </div>

</div>
